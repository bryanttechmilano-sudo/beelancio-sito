<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 480 300" role="img" aria-label="Safari sul Mac: menu File, poi Aggiungi al Dock">
  <rect width="480" height="300" rx="16" fill="#f6f3ec"/>
  <!-- barra dei menu del Mac -->
  <rect x="20" y="20" width="440" height="26" rx="6" fill="#ffffff" stroke="#d9d2c3"/>
  <text x="34" y="38" font-size="13" fill="#1f1a12"></text>
  <text x="56" y="38" font-size="12.5" font-weight="700" fill="#1f1a12">Safari</text>
  <rect x="98" y="23" width="40" height="20" rx="5" fill="#2f6fdf"/>
  <text x="106" y="38" font-size="12.5" fill="#ffffff">File</text>
  <text x="150" y="38" font-size="12.5" fill="#1f1a12">Modifica</text>
  <text x="212" y="38" font-size="12.5" fill="#1f1a12">Vista</text>
  <text x="256" y="38" font-size="12.5" fill="#1f1a12">Cronologia</text>
  <!-- menu File aperto -->
  <rect x="98" y="48" width="230" height="226" rx="10" fill="#ffffff" stroke="#d9d2c3"/>
  <text x="114" y="74" font-size="12.5" fill="#3a342a">Nuova finestra</text>
  <text x="114" y="98" font-size="12.5" fill="#3a342a">Nuovo pannello</text>
  <text x="114" y="122" font-size="12.5" fill="#3a342a">Apri file…</text>
  <line x1="110" y1="134" x2="316" y2="134" stroke="#ece7dc"/>
  <text x="114" y="154" font-size="12.5" fill="#3a342a">Chiudi finestra</text>
  <text x="114" y="178" font-size="12.5" fill="#3a342a">Salva come…</text>
  <line x1="110" y1="190" x2="316" y2="190" stroke="#ece7dc"/>
  <rect x="104" y="198" width="218" height="26" rx="6" fill="#2f6fdf"/>
  <text x="114" y="216" font-size="12.5" font-weight="700" fill="#ffffff">Aggiungi al Dock…</text>
  <text x="114" y="246" font-size="12.5" fill="#3a342a">Condividi</text>
  <circle cx="213" cy="211" r="0" fill="none"/>
  <rect x="100" y="194" width="226" height="34" rx="9" fill="none" stroke="#f5a800" stroke-width="3.5"/>
  <!-- Dock con l'icona -->
  <rect x="350" y="214" width="96" height="56" rx="14" fill="#ffffff" stroke="#d9d2c3"/>
  <rect x="362" y="224" width="34" height="34" rx="8" fill="#f5a800"/>
  <text x="371" y="247" font-size="16" font-weight="800" fill="#1f1a12">B</text>
  <rect x="402" y="224" width="34" height="34" rx="8" fill="#ece7dc"/>
  <text x="352" y="204" font-size="11.5" fill="#8a5a00" font-weight="700">nel Dock</text>
</svg>
